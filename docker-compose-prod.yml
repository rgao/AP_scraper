services:
  mongodb:
    image: mongo:latest
    container_name: apscraper-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    image: apscraper-server
    container_name: apscraper-node-server
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    env_file: 
      - ./server/.env
      - ./server/.env.production
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    image: apscraper-client
    container_name: apscraper-react-client
    command: npm start
    volumes:
      - ./client/:/app/client
      - /app/client/node_modules
    env_file: ./client/.env.production
    depends_on:
      - server
    ports:
      - "3000:3000"
    networks:
      - app-network
      
networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local